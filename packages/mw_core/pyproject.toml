[project]
name = "mw-core"
version = "0.1.0"
description = "MotionWeaver compiler core: motion_spec, geometry, rig, exporters"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.5",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
# Deterministic geometry backends. Kept optional so the pure-spec core stays
# lightweight and importable without heavy native deps.
geometry = [
    "trimesh>=4.0",
    "open3d>=0.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mw_core"]
