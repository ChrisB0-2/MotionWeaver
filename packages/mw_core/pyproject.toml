[project]
name = "mw-core"
version = "0.1.0"
description = "MotionWeaver compiler core: motion_spec, geometry, rig, exporters"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.5",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
# Deterministic geometry backends. Kept optional so the pure-spec core stays
# lightweight and importable without heavy native deps.
geometry = [
    "trimesh>=4.0",
    # trimesh only hard-requires numpy; the features we call need these too:
    # mesh.split() needs a graph engine (scipy.sparse.csgraph) and
    # proximity.ProximityQuery needs an rtree spatial index. Both verified
    # permissive (BSD-3-Clause / MIT).
    "scipy>=1.10",
    "rtree>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mw_core"]
