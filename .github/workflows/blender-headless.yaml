name: Blender headless

# Runs the deterministic rig/export pipeline inside headless Blender so that
# Blender-specific build logic is regression-tested separately from the pure
# Python core. See packages/mw_blender and docs/development.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  blender-smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Baseline LTS plus a smoke test against the current general release.
        blender: ["4.5", "5.1"]
      fail-fast: false
