name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        # Pinned to an exact release: setup-uv publishes no moving v8 major
        # tag, and the old @v3 bootstrap broke (every CI run since scaffold
        # failed at this step before reaching lint/type/test).
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync dependencies
        run: uv sync --all-extras --dev

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format check)
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy packages/mw_core/src packages/mw_ai/src

      - name: pytest
        run: uv run pytest
